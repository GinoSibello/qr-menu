services:
  db:
    image: postgres:16-alpine
    container_name: qr-menu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrmenu
      POSTGRES_PASSWORD: qrmenu
      POSTGRES_DB: qrmenu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qrmenu"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
